<!DOCTYPE html>
<html>
<head><title>Editor Diagnostics</title></head>
<body style="font-family:monospace; background:#1a1a2e; color:#e2e8f0; padding:20px;">
<h2>Editor CDN Diagnostics</h2>
<pre id="log">Starting checks...
</pre>
<script>
const log = document.getElementById('log');
function L(msg) { log.textContent += msg + '\n'; console.log(msg); }

(async () => {
  // Test 1: Basic fetch
  try {
    L('[1] Testing fetch API... OK');
  } catch(e) { L('[1] fetch API: FAIL - ' + e); }

  // Test 2: Split.js (already loaded via <script>)
  try {
    L('[2] Split.js: ' + (typeof Split !== 'undefined' ? 'OK (loaded)' : 'NOT LOADED'));
  } catch(e) { L('[2] Split.js: FAIL - ' + e); }

  // Test 3: PDF.js static import
  try {
    const t0 = Date.now();
    const pdfjs = await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.9.155/pdf.min.mjs');
    L('[3] PDF.js import: OK (' + (Date.now()-t0) + 'ms) - version: ' + (pdfjs.version || 'unknown'));
  } catch(e) { L('[3] PDF.js import: FAIL - ' + e.message); }

  // Test 4: esm.sh basic
  try {
    const t0 = Date.now();
    const cm = await import('https://esm.sh/@codemirror/state@6.5.2');
    L('[4] esm.sh @codemirror/state: OK (' + (Date.now()-t0) + 'ms) - has EditorState: ' + !!cm.EditorState);
  } catch(e) { L('[4] esm.sh @codemirror/state: FAIL - ' + e.message); }

  // Test 5: esm.sh view
  try {
    const t0 = Date.now();
    const v = await import('https://esm.sh/@codemirror/view@6.36.5');
    L('[5] esm.sh @codemirror/view: OK (' + (Date.now()-t0) + 'ms) - has EditorView: ' + !!v.EditorView);
  } catch(e) { L('[5] esm.sh @codemirror/view: FAIL - ' + e.message); }

  // Test 6: API connectivity
  try {
    const t0 = Date.now();
    const r = await fetch('/health');
    const d = await r.json();
    L('[6] API /health: OK (' + (Date.now()-t0) + 'ms) - ' + JSON.stringify(d));
  } catch(e) { L('[6] API /health: FAIL - ' + e.message); }

  // Test 7: resolve-doc API
  try {
    const t0 = Date.now();
    const r = await fetch('/api/editor/resolve-doc/test', { headers: {'X-Atlas-Admin-Token': 'e2e-admin-token'} });
    L('[7] resolve-doc API: ' + r.status + ' (' + (Date.now()-t0) + 'ms) - ' + (r.status === 404 ? 'OK (expected 404)' : await r.text()));
  } catch(e) { L('[7] resolve-doc API: FAIL - ' + e.message); }

  // Test 8: Dynamic import alternative (jsdelivr)
  try {
    const t0 = Date.now();
    const cm2 = await import('https://cdn.jsdelivr.net/npm/@codemirror/state@6.5.2/+esm');
    L('[8] jsdelivr @codemirror/state: OK (' + (Date.now()-t0) + 'ms) - has EditorState: ' + !!cm2.EditorState);
  } catch(e) { L('[8] jsdelivr @codemirror/state: FAIL - ' + e.message); }

  L('\n=== Done ===');
  L('If tests 4-5 fail but 8 passes, switch CDN from esm.sh to jsdelivr.');
  L('If tests 3-5 all fail, browser may block cross-origin module imports.');
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/split.js/1.6.5/split.min.js"></script>
</body>
</html>
