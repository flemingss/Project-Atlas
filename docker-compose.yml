services:
  postgres:
    image: postgres:16
    container_name: atlas-postgres
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
    ports:
      # Host port remapped to avoid colliding with other local Postgres
      # instances. The container still listens on 5432, and compose-internal
      # DSNs (postgres:5432) are unaffected.
      - "15432:5432"
    volumes:
      - atlas_postgres:/var/lib/postgresql/data
      - ./docker/postgres/init-multi-db.sql:/docker-entrypoint-initdb.d/01-init-multi-db.sql:ro
    # Every other long-lived service restarts; without this, postgres alone
    # stays down after a Docker Desktop / WSL restart and the dev container
    # then blocks forever on its service_healthy dependency.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.11.5
    container_name: atlas-qdrant
    ports:
      # Host HTTP endpoint: http://localhost:17333 (container still listens on 6333)
      - "17333:6333"
      # gRPC port — remapped to avoid Windows Hyper-V dynamic excluded-port ranges
      - "17334:6334"
    volumes:
      - atlas_qdrant:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------
  # Embedding sidecar (CPU).
  #
  # Embeddings live in the stack rather than on the operator's machine so that
  # ingest and search never depend on LM Studio being up. This is the one part
  # of the LLM path that is NOT profile-switchable: a vector search only
  # returns meaningful results when the query and the documents were embedded
  # by the same model, so swapping the embedder under an existing corpus
  # corrupts retrieval — silently, when the dimension happens to match.
  #
  # CPU is deliberate. Embedding is a single forward pass over <=400-token
  # chunks, with no decode loop and no KV cache, so it is cheap locally even
  # though generation is not. Expect minutes, not seconds, on a 2000-page
  # manual (~2,300 chunks); fine for batch ingest.
  # ---------------------------------------------------------------------
  embeddings:
    # cpu-1.5 crash-loops on first boot: its bundled hf-hub 0.3.2 cannot follow
    # the relative redirect URLs the HF CDN now returns ("relative URL without
    # a base"), so the weights download fails before serving starts. 1.9.x
    # bundles a fixed hf-hub. Same model, same API.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    container_name: atlas-embeddings
    command: ["--model-id", "nomic-ai/nomic-embed-text-v1.5", "--port", "80"]
    ports:
      # Host debugging only; Atlas reaches it as http://embeddings:80 on the
      # compose network. 18080 is deliberately avoided — docker-compose.optest.yml
      # publishes Atlas there, and the two stacks should be able to coexist.
      - "18090:80"
    volumes:
      # Cache the weights so restarts do not re-download ~550MB.
      - atlas_embeddings_cache:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/80'"]
      interval: 10s
      timeout: 5s
      retries: 20
      # Weights download on first boot; allow for a slow cold start.
      start_period: 180s

  atlas:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ATLAS_PIP_EXTRAS: ${ATLAS_PIP_EXTRAS:-}
    container_name: atlas-api
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    environment:
      ATLAS_ENV: ${ATLAS_ENV:-dev}
      ATLAS_LOG_LEVEL: ${ATLAS_LOG_LEVEL:-INFO}
      # OpenAI-compatible base URL (LM Studio on the host). Use host.docker.internal on Docker Desktop.
      ATLAS_OPENAI_BASE_URL: ${ATLAS_OPENAI_BASE_URL:-http://host.docker.internal:1234}
      # Admin auth. Leave blank for dev; required for non-dev.
      ATLAS_ADMIN_TOKEN: ${ATLAS_ADMIN_TOKEN:-}
      ATLAS_DEV_BYPASS_ADMIN_AUTH: ${ATLAS_DEV_BYPASS_ADMIN_AUTH:-false}
      ATLAS_HOST: 0.0.0.0
      ATLAS_PORT: 8080
      ATLAS_CONFIG_DIR: /app/config
      ATLAS_ARTIFACTS_DIR: /app/artifacts
      # PDF guardrails
      ATLAS_PDF_MAX_BYTES: ${ATLAS_PDF_MAX_BYTES:-209715200}
      # Use service hostnames inside the compose network (do not inherit host .env localhost URLs).
      ATLAS_DB_URL: postgresql+psycopg://atlas:atlas@postgres:5432/atlas
      ATLAS_QDRANT_URL: http://qdrant:6333
      # Embedding sidecar on the compose network (no API key needed).
      ATLAS_EMBEDDINGS_BASE_URL: http://embeddings:80
      # Active LLM profile: 'api' (OpenRouter, ZDR-enforced) or 'local' (LM Studio).
      ATLAS_LLM_PROFILE: ${ATLAS_LLM_PROFILE:-api}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "28080:8080"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; r=httpx.get('http://localhost:8080/health',timeout=3); exit(0 if r.status_code==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./artifacts:/app/artifacts

  redis:
    image: redis:7
    container_name: atlas-redis
    profiles: ["dify"]
    ports:
      - "6379:6379"
    volumes:
      - atlas_redis:/data
    command: ["redis-server", "--requirepass", "${DIFY_REDIS_PASSWORD:-difyai123456}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${DIFY_REDIS_PASSWORD:-difyai123456} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  # -------------------- Dify (optional / experimental) --------------------
  # Dify services are behind the `dify` profile so Atlas boots cleanly by default.
  # To start Dify too: `docker compose --profile dify up -d`
  dify-api:
    image: langgenius/dify-api:1.12.1
    container_name: atlas-dify-api
    profiles: ["dify"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5001:5001"
    environment:
      MODE: api
      LOG_LEVEL: ${DIFY_LOG_LEVEL:-INFO}
      SECRET_KEY: ${DIFY_SECRET_KEY:-sk-change-me}
      INIT_PASSWORD: ${DIFY_INIT_PASSWORD:-}

      # Storage (OpenDAL)
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: /app/api/storage

      DB_TYPE: postgresql
      DB_USERNAME: atlas
      DB_PASSWORD: atlas
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: dify

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${DIFY_REDIS_PASSWORD:-difyai123456}
      CELERY_BROKER_URL: redis://:${DIFY_REDIS_PASSWORD:-difyai123456}@redis:6379/1
      CELERY_BACKEND: redis

      # Keep Dify's internal dataset vector store available without adding extra DBs.
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${DIFY_QDRANT_API_KEY:-}

      # URLs used by Dify UI for console/app API targets.
      CONSOLE_WEB_URL: ${DIFY_CONSOLE_WEB_URL:-http://localhost}
      CONSOLE_API_URL: ${DIFY_CONSOLE_API_URL:-http://localhost:5001}
      APP_WEB_URL: ${DIFY_APP_WEB_URL:-http://localhost}
      APP_API_URL: ${DIFY_APP_API_URL:-http://localhost:5001}

      MIGRATION_ENABLED: "true"
    volumes:
      - ./volumes/dify/storage:/app/api/storage

  dify-worker:
    image: langgenius/dify-api:1.12.1
    container_name: atlas-dify-worker
    profiles: ["dify"]
    restart: unless-stopped
    depends_on:
      dify-api:
        condition: service_started
    environment:
      MODE: worker
      LOG_LEVEL: ${DIFY_LOG_LEVEL:-INFO}
      SECRET_KEY: ${DIFY_SECRET_KEY:-sk-change-me}

      # Storage (OpenDAL)
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: /app/api/storage

      DB_TYPE: postgresql
      DB_USERNAME: atlas
      DB_PASSWORD: atlas
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: dify

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${DIFY_REDIS_PASSWORD:-difyai123456}
      CELERY_BROKER_URL: redis://:${DIFY_REDIS_PASSWORD:-difyai123456}@redis:6379/1
      CELERY_BACKEND: redis

      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${DIFY_QDRANT_API_KEY:-}
      MIGRATION_ENABLED: "true"
    volumes:
      - ./volumes/dify/storage:/app/api/storage

  dify-worker-beat:
    image: langgenius/dify-api:1.12.1
    container_name: atlas-dify-worker-beat
    profiles: ["dify"]
    restart: unless-stopped
    depends_on:
      dify-api:
        condition: service_started
    environment:
      MODE: beat
      LOG_LEVEL: ${DIFY_LOG_LEVEL:-INFO}
      SECRET_KEY: ${DIFY_SECRET_KEY:-sk-change-me}

      # Storage (OpenDAL)
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: /app/api/storage

      DB_TYPE: postgresql
      DB_USERNAME: atlas
      DB_PASSWORD: atlas
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: dify

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${DIFY_REDIS_PASSWORD:-difyai123456}
      CELERY_BROKER_URL: redis://:${DIFY_REDIS_PASSWORD:-difyai123456}@redis:6379/1
      CELERY_BACKEND: redis

      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${DIFY_QDRANT_API_KEY:-}
      MIGRATION_ENABLED: "true"
    volumes:
      - ./volumes/dify/storage:/app/api/storage

  dify-web:
    image: langgenius/dify-web:1.12.1
    container_name: atlas-dify-web
    profiles: ["dify"]
    restart: unless-stopped
    depends_on:
      dify-api:
        condition: service_started
    ports:
      - "80:3000"
    environment:
      CONSOLE_WEB_URL: ${DIFY_CONSOLE_WEB_URL:-http://localhost}
      CONSOLE_API_URL: ${DIFY_CONSOLE_API_URL:-http://localhost:5001}
      APP_WEB_URL: ${DIFY_APP_WEB_URL:-http://localhost}
      APP_API_URL: ${DIFY_APP_API_URL:-http://localhost:5001}

  dify-plugin-daemon:
    image: langgenius/dify-plugin-daemon:0.5.3-local
    container_name: atlas-dify-plugin-daemon
    profiles: ["dify"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      dify-api:
        condition: service_started
    ports:
      - "5003:5003"
    environment:
      DB_TYPE: postgresql
      DB_USERNAME: atlas
      DB_PASSWORD: atlas
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: dify_plugin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${DIFY_REDIS_PASSWORD:-difyai123456}
      SERVER_PORT: 5002
      SERVER_KEY: ${DIFY_PLUGIN_DAEMON_KEY:-change-me}
      DIFY_INNER_API_URL: http://dify-api:5001
      DIFY_INNER_API_KEY: ${DIFY_PLUGIN_DIFY_INNER_API_KEY:-change-me}
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: 5003
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
      PLUGIN_WORKING_PATH: /app/storage/cwd
      PLUGIN_INSTALLED_PATH: plugin
      PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
      PLUGIN_MEDIA_CACHE_PATH: assets
    volumes:
      - ./volumes/dify/plugin-daemon:/app/storage

volumes:
  atlas_embeddings_cache:
  atlas_postgres:
  atlas_qdrant:
  atlas_redis:
