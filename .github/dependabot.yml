# Weekly dependency update PRs, grouped to keep review load low.
# The pip lockfiles are Linux-compiled (see requirements*.lock headers);
# after merging a pip bump, regenerate them per docs/WORKLOG.md.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Deferred majors — each is a real migration, not a version bump.
      # Remove the entry when its migration is scheduled:
      # - eslint 9+: flat-config rewrite (plus plugin compatibility).
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # - eslint-plugin-react-refresh 0.5+ peer-requires eslint 9/10 —
      #   part of the same migration.
      - dependency-name: eslint-plugin-react-refresh
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # - pdfjs-dist 5+: worker/version coupling with the editor's PDF pane;
      #   needs editor regression testing before adopting.
      - dependency-name: pdfjs-dist
        update-types: ["version-update:semver-major"]
      # - react-resizable-panels 4: renamed exports (Group/Separator) AND the
      #   data-attribute contract our resizable component styles against;
      #   migrate together with an editor layout regression pass.
      - dependency-name: react-resizable-panels
        update-types: ["version-update:semver-major"]
      # - tailwind-merge 3 targets Tailwind v4; we are on Tailwind 3 —
      #   adopt with a future Tailwind 4 migration.
      - dependency-name: tailwind-merge
        update-types: ["version-update:semver-major"]
      # - react 19: framework major; adopt deliberately with a full sweep.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node majors track LTS deliberately (25 is a non-LTS current release);
      # bump the Dockerfile ui-build stage to the next LTS by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
