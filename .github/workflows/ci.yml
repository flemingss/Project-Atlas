# CI — integrity gates for every push and PR.
#
# backend: installs from the Linux-compiled lockfile (CPU torch via the
#   pytorch index — ~200MB instead of the ~6GB CUDA bundle), runs a clean
#   `ruff check` (debt is registered in pyproject, the line holds here) and
#   the full pytest suite (733 passed / 6 skipped on 2026-08-28, 80% coverage gate from pyproject).
#   Integration tests self-skip when Qdrant/Postgres are unreachable.
#
# web: npm ci + eslint + `npm run build` — the build runs `tsc -b`, which is
#   the API-contract drift gate (src/api-types.gen.ts is generated from the
#   backend OpenAPI schema; see web/README.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
    steps:
      - uses: actions/checkout@v7
      - name: Python version matches the runtime image
        # CI installs its own Python and never builds the Dockerfile, so a base
        # image bump (e.g. a Dependabot python 3.11 -> 3.14 PR) would go green
        # here while testing a version the appliance does not run. Fail loudly
        # instead: bump both together, deliberately.
        run: |
          image_py=$(grep -oP '^FROM python:\K[0-9]+\.[0-9]+' Dockerfile | head -1)
          ci_py=$(grep -oP 'python-version: "\K[0-9]+\.[0-9]+' .github/workflows/ci.yml | head -1)
          echo "Dockerfile: $image_py / CI: $ci_py"
          if [ "$image_py" != "$ci_py" ]; then
            echo "::error::Dockerfile python ($image_py) != CI python ($ci_py) — update both together."
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install (locked)
        run: |
          pip install -r requirements-dev.lock
          pip install --no-deps .
      - name: Seed operator config
        # config/*.yaml are gitignored operator-local files (only *.example is
        # committed); tests load them. Mirrors .devcontainer/post-create.sh.
        run: |
          cp config/pipeline.yaml.example config/pipeline.yaml
          cp config/models.yaml.example config/models.yaml
      - name: Lint
        # scripts/ is included: it is operator-facing tooling (backup, flush,
        # quality measurement) and was previously unlinted, so a new script
        # could ship with problems the same check would have caught in src/.
        run: ruff check src tests scripts
      - name: Type check
        # Registered debt lives in pyproject's mypy overrides; the line holds
        # everywhere else. This gate found a real one on its first run —
        # huggingface_hub 1.x dropped a kwarg the model downloader still passed.
        run: mypy
      - name: Tests
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build (tsc contract gate + vite)
        run: npm run build
