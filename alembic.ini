# Alembic configuration.
#
# The database URL is deliberately NOT set here — migrations/env.py reads it
# from atlas.settings (ATLAS_DB_URL), so migrations always target the same
# database the application does and there is no second place to keep in sync.
[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# Timestamped, ordered filenames: revision hashes alone make review order and
# history impossible to read at a glance.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
