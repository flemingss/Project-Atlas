[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-atlas"
version = "0.1.0"
description = "Adaptive Agentic Knowledge Runtime (Project Atlas)"
requires-python = ">=3.11"
authors = [{ name = "Project Atlas" }]
readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0.1",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "qdrant-client>=1.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "integration: integration tests that hit external services (e.g., Docker Qdrant); skipped unless explicitly selected",
]
