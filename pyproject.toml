[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-atlas"
version = "0.8.0"
description = "Adaptive Agentic Knowledge Runtime (Project Atlas)"
requires-python = ">=3.11"
authors = [{ name = "Project Atlas" }]
readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0.1",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "qdrant-client>=1.9.0",
  # Floor matches requirements.lock. Leaving this fully unconstrained let a
  # resolver pick any release at all, including ones predating APIs used in
  # pipeline/docling_adapter.py.
  "docling>=2.76",
  "onnxruntime>=1.17",
  "PyMuPDF>=1.24.0",
  "pdfplumber>=0.10",
  "pyclipper>=1.3",
  "shapely>=2.0",
  "scikit-learn>=1.4",
  "opencv-python-headless>=4.9",
  "huggingface-hub>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

ui = [
  # React SPA — no Python dependencies; build with `npm run build` in web/
]

# Optional: lightweight HTML -> Markdown conversion for text/html ingestion
# when Docling is not installed.
html = [
  "markdownify>=0.13.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# EXE002 (shebang-missing-executable-file) cannot produce a correct signal when
# the tree is bind-mounted from Windows/macOS into a container: Docker Desktop
# presents every file as 0777, so all 139 .py files look executable. Git's
# recorded mode (100644) is the real source of truth here.
#
# ── Registered debt (2026-08-28) ─────────────────────────────────────────
# Every rule below EXE002 is pre-existing debt registered so CI can enforce
# a clean `ruff check` and hold the line on everything else. Each needs
# case-by-case judgment (most BLE001/S110 sites are deliberate best-effort
# guards). Remove a code from this list when its findings are fixed —
# never add one to silence a new finding.
ignore = [
  "EXE002",
  "B008",    # 3× function-call-in-default (FastAPI File(...) idiom)
  "B017",    # 1× assert-raises-Exception in a test
  "BLE001",  # 47× blind except — mostly deliberate best-effort guards
  "G201",    # 2× logging.error(exc_info=True) vs .exception()
  "PLC0206", # 1× dict-index-missing-items
  "RUF012",  # 4× mutable-class-default
  "RUF059",  # 16× unused unpacked variable
  "S110",    # 12× try-except-pass
  "S112",    # 3× try-except-continue
  "SIM102",  # 3× collapsible-if (readability judgment)
  "TRY004",  # 8× raise-TypeError-for-type-checks
  "TRY201",  # 2× verbose raise
]

[tool.ruff.lint.per-file-ignores]
# _find_and_tag closes over per-page loop state but is only ever called
# within the same iteration (verified 2026-08-28); binding explicitly would
# mean refactoring dense vendored OCR logic for no behavioral gain.
"src/atlas/ingest/layout_recognizer.py" = ["B023"]

[tool.mypy]
# A type gate, not a type crusade. It runs over the whole package and must stay
# clean, so a new type error fails CI rather than accumulating silently.
#
# It has already earned its place: it caught that huggingface_hub 1.x removed
# `local_dir_use_symlinks`, which made the runtime deepdoc model download raise
# TypeError on both its primary and fallback paths. Nothing else noticed,
# because the image bakes those weights in at build time.
python_version = "3.11"
files = ["src/atlas"]
# Third-party packages here ship no stubs (docling, pyclipper, deepdoc deps).
ignore_missing_imports = true
# Optional-strictness would add a few hundred findings that say nothing about
# correctness in this codebase. Revisit once the modules below are clean.
strict_optional = false

[[tool.mypy.overrides]]
# ── Registered debt (2026-08-28) ────────────────────────────────────────
# These modules are exempt because their findings come from third-party stub
# strictness rather than from anything wrong here: numpy dtype narrowing in
# the vendored OCR/layout code, cv2 overloads, and qdrant-client's very wide
# Filter unions (a list[FieldCondition] is genuinely valid). Each was read
# before being listed. Remove a module from this list when it is fixed —
# never add one to silence a new finding elsewhere.
module = [
  "atlas.ingest",
  "atlas.ingest.ocr",
  "atlas.ingest.postprocess",
  "atlas.ingest.pdf_parser",
  "atlas.ingest.page_renderer",
  "atlas.ingest.layout_recognizer",
  "atlas.ingest.table_recognizer",
  "atlas.vectorstore.qdrant_store",
  "atlas.llm.deterministic",
  "atlas.admin.maintenance",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=atlas.pipeline --cov-report=term-missing --cov-fail-under=80"
markers = [
  "integration: integration tests that hit external services (e.g., Docker Qdrant); skipped unless explicitly selected",
]
