# ════════════════════════════════════════════════════════════════════════════════
# docker-compose.slim.yml — Lightweight Atlas stack for VLM-only ingestion
# ════════════════════════════════════════════════════════════════════════════════
#
# USE:  docker compose -f docker-compose.slim.yml up -d
#
# This variant builds the API using Dockerfile.slim, which removes Docling and
# all heavy ML dependencies (onnxruntime, torch, transformers, opencv, etc).
#
# RESULT: Image size drops from ~13.8GB to ~1.5-2GB
#
# TRADE-OFF: Cannot use Docling ingestion method. All PDF ingestion must go
# through the VLM path (server-side PDF rendering + vision model).
#
# ════════════════════════════════════════════════════════════════════════════════

services:
  postgres:
    image: postgres:16
    container_name: atlas-postgres
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
    ports:
      - "5432:5432"
    volumes:
      - atlas_postgres:/var/lib/postgresql/data
      - ./docker/postgres/init-multi-db.sql:/docker-entrypoint-initdb.d/01-init-multi-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.11.5
    container_name: atlas-qdrant
    ports:
      - "17333:6333"
      - "17334:6334"
    volumes:
      - atlas_qdrant:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  atlas:
    build:
      context: .
      dockerfile: Dockerfile.slim  # ← KEY: Use slim variant instead of Dockerfile
      args:
        ATLAS_PIP_EXTRAS: ${ATLAS_PIP_EXTRAS:-}
    container_name: atlas-api
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      ATLAS_ENV: ${ATLAS_ENV:-dev}
      ATLAS_LOG_LEVEL: ${ATLAS_LOG_LEVEL:-INFO}
      ATLAS_OPENAI_BASE_URL: ${ATLAS_OPENAI_BASE_URL:-http://host.docker.internal:1234}
      ATLAS_ADMIN_TOKEN: ${ATLAS_ADMIN_TOKEN:-}
      ATLAS_DEV_BYPASS_ADMIN_AUTH: ${ATLAS_DEV_BYPASS_ADMIN_AUTH:-false}
      ATLAS_HOST: 0.0.0.0
      ATLAS_PORT: 8080
      ATLAS_CONFIG_DIR: /app/config
      ATLAS_ARTIFACTS_DIR: /app/artifacts
      ATLAS_PDF_MAX_BYTES: ${ATLAS_PDF_MAX_BYTES:-209715200}
      ATLAS_DB_URL: postgresql+psycopg://atlas:atlas@postgres:5432/atlas
      ATLAS_QDRANT_URL: http://qdrant:6333
    ports:
      - "28080:8080"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; r=httpx.get('http://localhost:8080/health',timeout=3); exit(0 if r.status_code==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./artifacts:/app/artifacts

volumes:
  atlas_postgres:
  atlas_qdrant:
